<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>English Boarding Pass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: desktop app shell — fixed sidebar (nav + level badge) and a scrolling main column of screens. Night-flight palette: deep navy, runway blue, boarding-gold for XP. */
:root{
  --bg:#0b1020; --panel:#121a31; --panel-2:#18223f; --panel-3:#1f2b4f; --line:#26335c;
  --ink:#eaf0ff; --muted:#93a2c8; --dim:#62719a;
  --blue:#5b8cff; --blue-ink:#07112b; --blue-soft:#1c2b5c;
  --gold:#ffc04d; --gold-soft:#3a2f17;
  --green:#3ed69b; --green-soft:#123a2e; --red:#ff6b7a; --red-soft:#3d1a22;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef2fa; --panel:#ffffff; --panel-2:#f4f6fc; --panel-3:#e8edf8; --line:#d7deef;
  --ink:#121a33; --muted:#56658c; --dim:#8a96b5;
  --blue:#2f5fe0; --blue-ink:#ffffff; --blue-soft:#e2e9fd;
  --gold:#c98a00; --gold-soft:#fbf0d6;
  --green:#0f9a68; --green-soft:#dcf4ea; --red:#d63a4b; --red-soft:#fde2e5;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
/* Sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-size:20px;transform:rotate(-8deg)}
.brand b{font-family:var(--display);font-size:17px;line-height:1.05}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:700;text-align:left}
nav button .i{width:22px;text-align:center;font-size:17px}
nav button:hover{background:var(--panel-2);color:var(--ink)}
nav button[aria-current="page"]{background:var(--blue-soft);color:var(--ink)}
nav button .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--gold);color:#241a00;border-radius:999px;padding:1px 7px}
.rank{margin-top:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rank .row{display:flex;justify-content:space-between;align-items:baseline}
.rank b{font-family:var(--display);font-size:16px}
.bar{height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:99px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
main{overflow-y:auto;min-width:0}
.screen{max-width:1080px;margin:0 auto;padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:34px;font-weight:800}
.head p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:19px}
.muted{color:var(--muted)}
.card.stat{flex-direction:row;align-items:center;gap:14px}
.stat>div{display:flex;flex-direction:column;gap:4px}
.stat .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none}
.stat b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:10px 16px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241a00}
.btn.big{padding:14px 22px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 12px;font-size:13.5px}
button.chip:hover{border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.pill.ok{background:var(--green-soft);color:var(--green)}.pill.gold{background:var(--gold-soft);color:var(--gold)}
/* Home hero: flight route */
.hero{background:radial-gradient(120% 140% at 100% 0%,var(--blue-soft) 0%,var(--panel) 55%);border:1px solid var(--line);border-radius:22px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.hero h2{font-size:28px;font-weight:800}
.route{display:flex;align-items:center;gap:14px;margin-top:14px}
.route .code{font-family:var(--display);font-weight:800;font-size:30px}
.route .code small{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;color:var(--muted)}
.track{flex:1;position:relative;height:28px;min-width:120px}
.track::before{content:"";position:absolute;left:0;right:0;top:13px;border-top:2px dashed var(--line)}
.track .done{position:absolute;left:0;top:12px;height:4px;background:var(--gold);border-radius:4px}
.track .plane{position:absolute;top:0;font-size:22px;transform:translateX(-50%);color:var(--gold)}
.track .wp{position:absolute;top:9px;width:10px;height:10px;border-radius:50%;background:var(--panel-3);border:2px solid var(--line);transform:translateX(-50%)}
.track .wp.on{background:var(--gold);border-color:var(--gold)}
.mission{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel-3);font-family:var(--mono);font-size:12px;font-weight:700}
.step.done{border-color:var(--green);background:var(--green-soft)}
.step.done .n{background:var(--green);color:#03231a}
.step small{display:block;color:var(--muted);font-size:13px}
.step .go{border:0;background:transparent;color:var(--blue);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .b{width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:var(--blue-soft);min-height:4px;position:relative}
.chart .b.full{background:var(--blue)}
.chart .b.today{outline:2px solid var(--gold);outline-offset:2px}
.chart .v{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chart .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qa{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.qa:hover{border-color:var(--blue);transform:translateY(-1px)}
.qa .e{font-size:26px}
.qa b{font-family:var(--display);font-size:17px}
.qa small{color:var(--muted)}
/* Path */
.unit{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}
.unit.locked{opacity:.55}
.unit.now{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.unit .wk{font-family:var(--display);font-weight:800;font-size:44px;color:var(--blue);line-height:1}
.nodes{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;width:96px}
.node .c{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--panel-3);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.node:hover .c{border-color:var(--blue)}
.node.done .c{background:var(--green-soft);border-color:var(--green);box-shadow:0 5px 0 var(--green)}
.node.next .c{background:var(--blue);border-color:var(--blue);box-shadow:0 5px 0 #2b4bb0;color:var(--blue-ink)}
.node span{font-size:12.5px;font-weight:700;text-align:center;color:var(--muted)}
.node.next span{color:var(--ink)}
/* Lesson */
.lesson{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:22px}
.ltop{display:flex;align-items:center;gap:14px}
.ltop .x{border:0;background:transparent;font-size:22px;color:var(--muted)}
.ltop .bar{flex:1;height:14px}
.ltop .xp{font-family:var(--mono);font-weight:700;color:var(--gold)}
.q{font-family:var(--display);font-size:28px;font-weight:700}
.q .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue)}
.qsub{color:var(--muted);margin-top:-12px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 18px;text-align:left;font-size:17px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--line)}
.opt .k{font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 4px 0 var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft);box-shadow:0 4px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);box-shadow:0 4px 0 var(--red)}
.tray{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.feedback{border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.feedback.ok{background:var(--green-soft);color:var(--green)}
.feedback.no{background:var(--red-soft);color:var(--red)}
.feedback b{font-family:var(--display);font-size:20px;display:block}
.feedback p{margin:2px 0 0;color:var(--ink)}
.listenbtn{width:96px;height:96px;border-radius:24px;border:0;background:var(--blue);color:var(--blue-ink);font-size:40px;box-shadow:0 6px 0 #2b4bb0}
.listenbtn.slow{width:64px;height:64px;font-size:24px;border-radius:18px;background:var(--panel-3);color:var(--ink);box-shadow:0 5px 0 var(--line)}
textarea,input,select{font:inherit;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:12px 14px}
textarea{resize:vertical;min-height:90px;width:100%}
.done-screen{text-align:center;align-items:center}
.done-screen .big{font-size:72px}
.done-screen .stats3{display:flex;gap:12px}
.done-screen .stats3 .card{min-width:150px;align-items:center}
/* Flashcards */
.fc-wrap{perspective:1200px;max-width:620px;width:100%;margin:0 auto}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s}
.fc.flip{transform:rotateY(180deg)}
.fc .side{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
.fc .back{transform:rotateY(180deg);background:var(--panel-2)}
.fc .phrase{font-family:var(--display);font-size:34px;font-weight:800}
.fc .mean{font-size:22px;font-weight:700;color:var(--gold)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:620px;margin:0 auto;width:100%}
.rate button{border-radius:14px;padding:12px;border:2px solid var(--line);background:var(--panel);font-weight:700;display:flex;flex-direction:column;align-items:center}
.rate button small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.rate .r1{border-color:var(--red)}.rate .r2{border-color:var(--gold)}.rate .r3{border-color:var(--blue)}.rate .r4{border-color:var(--green)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
/* Talk */
.talk{display:grid;grid-template-columns:280px 1fr 260px;gap:16px;height:calc(100vh - 150px);min-height:520px}
@media (max-width:1180px){.talk{grid-template-columns:240px 1fr}.talk .hints{display:none}}
.scen{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.sc{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;display:grid;grid-template-columns:40px 1fr;gap:10px;text-align:left;align-items:center}
.sc .e{font-size:26px;width:40px;height:40px;border-radius:11px;background:var(--panel-3);display:grid;place-items:center}
.sc b{display:block;font-size:14.5px}
.sc small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.sc[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.chatbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0}
.chathead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--gold));display:grid;place-items:center;font-size:20px;flex:none}
.chathead b{display:block}
.chathead small{color:var(--green);font-size:12.5px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--blue);color:var(--blue-ink);border-bottom-right-radius:5px;align-self:flex-end}
.msg.note{align-self:center;color:var(--muted);font-size:13px;background:transparent;text-align:center}
.msg .say{display:block;margin-top:6px;border:0;background:transparent;color:var(--blue);font-weight:700;font-size:12.5px;padding:0}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:48px;height:48px;max-height:140px;resize:none;flex:1;overflow-y:auto}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--blue-soft);font-size:20px;flex:none}
.hints{display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.fbk{background:var(--green-soft);border:1px solid var(--green);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
/* Progress */
.skill{display:grid;grid-template-columns:110px 1fr 44px;gap:12px;align-items:center}
.skill .bar{height:12px}
.skill b{font-family:var(--mono);font-size:13px;text-align:right}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,34px));gap:5px;justify-content:start}
.heat .d{aspect-ratio:1;border-radius:6px;background:var(--panel-3);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.heat .d.l1{background:var(--blue-soft);color:var(--ink)}.heat .d.l2{background:#3355b8;color:#fff}.heat .d.l3{background:var(--blue);color:var(--blue-ink)}
.heat .d.today{outline:2px solid var(--gold)}
.heat .d.blank{background:transparent}
.heat .h{font-family:var(--mono);font-size:10px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--gold);color:#241a00;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:var(--display);font-size:17px;transition:opacity .3s,transform .3s}
.toast[hidden]{display:block!important;opacity:0;transform:translateY(12px);pointer-events:none}
.banner{background:var(--gold-soft);color:var(--gold);border-radius:12px;padding:10px 14px;font-size:14px}
</style>
</head><body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo" aria-hidden="true">✈</span><div><b>English<br>Boarding Pass</b><small>BGA → USA</small></div></div>
    <nav id="nav">
      <button data-go="home"><span class="i">🏠</span>Inicio</button>
      <button data-go="path"><span class="i">🗺️</span>Ruta</button>
      <button data-go="cards"><span class="i">🃏</span>Tarjetas<span class="badge" id="due-badge" hidden>0</span></button>
      <button data-go="listen"><span class="i">🎧</span>Dictado</button>
      <button data-go="talk"><span class="i">💬</span>Conversar</button>
      <button data-go="progress"><span class="i">📈</span>Progreso</button>
      <button data-go="settings"><span class="i">⚙️</span>Ajustes</button>
    </nav>
    <div class="rank">
      <div class="row"><span class="label">Rango</span><span class="pill gold" id="r-xp">0 XP</span></div>
      <b id="r-name">Pasajero</b>
      <div class="bar"><i id="r-bar" style="width:0%"></i></div>
      <small class="muted" id="r-next"></small>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>

/* ---------- Lesson engine ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildItems(n){const w=week(n);const ex=EXTRA.build[n]||w.ej.filter(e=>!e.includes("___")).map(e=>({en:e}));return ex.map(x=>({type:"build",es:x.es,answer:x.en}))}

VIEWS.lesson=id=>{

function canCheck(){const it=L.items[L.i];return it.type==="mc"?L.sel!=null:it.type==="build"?L.tray.length>0:(L.typed||"").trim().length>0}
function check(){const it=L.items[L.i];let ok;

function finishLesson(){const bonus=50;const total=L.xp+bonus;S.lessons[L.id]={date:TODAY,score:L.right+"/"+L.items.length};if(L.kind.kind==="dict"){S.dictLog=S.dictLog||{};S.dictLog[TODAY]=1;S.dictations=(S.dictations||0)+L.items.length}addMin(8);addXP(total,"Lección completa");
  const nl=nextLesson();
  $("#main").innerHTML=`<div class="screen done-screen"><div class="big">🏆</div><h1>¡Lección completa!</h1><p class="muted">Semana ${L.n} · ${esc(L.kind.t)}</p>
  <div class="stats3"><div class="card"><span class="label">Aciertos</span><b style="font-family:var(--display);font-size:30px">${L.right}/${L.items.length}</b></div><div class="card"><span class="label">XP ganados</span><b style="font-family:var(--display);font-size:30px;color:var(--gold)">+${total}</b></div><div class="card"><span class="label">Racha</span><b style="font-family:var(--display);font-size:30px">🔥 ${streak()}</b></div></div>
  <div style="display:flex;gap:10px">${nl?`<button class="btn primary big" data-nav="lesson" data-arg="${nl.id}">Siguiente: ${esc(nl.t)}</button>`:""}<button class="btn big" data-nav="home">Volver al inicio</button></div></div>`}
document.addEventListener("click",e=>{if(view!=="lesson"||!L)return;
  const o=e.target.closest("[data-opt]");if(o&&!L.answered){L.sel=+o.dataset.opt;renderLesson();return}
  const t=e.target.closest("[data-tile]");if(t&&!L.answered){const i=+t.dataset.tile;if(!L.tray.some(x=>x.i===i)){L.tray.push(L.bank.find(b=>b.i===i));speak(L.bank.find(b=>b.i===i).w,1)}renderLesson();return}
  const u=e.target.closest("[data-untile]");if(u&&!L.answered){const i=+u.dataset.untile;L.tray=L.tray.filter(x=>x.i!==i);renderLesson()}});
document.addEventListener("keydown",e=>{if(view!=="lesson"||!L||e.target.tagName==="TEXTAREA")return;const it=L.items[L.i];if(it&&it.type==="mc"&&!L.answered&&/^[1-4]$/.test(e.key)&&+e.key<=it.options.length){L.sel=+e.key-1;renderLesson()}if(e.key==="Enter"){if(L.answered)next();else if(canCheck())check()}});
function mdBlock(s){let out="",inL=false;for(const l of s.split("\n")){if(/^\s*- /.test(l)){if(!inL){out+="<ul style='margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px'>";inL=true}out+="<li>"+md(l.replace(/^\s*- /,""))+"</li>"}else if(/^\s+\S/.test(l)&&inL){out=out.replace(/<\/li>$/," "+md(l.trim())+"</li>")}else{if(inL){out+="</ul>";inL=false}if(l.trim())out+="<p style='margin:0'>"+md(l)+"</p>"}}return out+(inL?"</ul>":"")}

    <textarea id="w-in" style="min-height:220px" placeholder="Escribe aquí en inglés, sin traductor…">${esc((S.drafts||{})[id]||"")}</textarea>

    <div id="w-out"></div></div></div>`;
  const ta=$("#w-in");const cnt=()=>{$("#w-count").textContent=(ta.value.trim().split(/\s+/).filter(Boolean).length)+" palabras";S.drafts=S.drafts||{};S.drafts[id]=ta.value;save()};ta.oninput=cnt;cnt();
  $("#w-go").onclick=async()=>{if(ta.value.trim().length<20){$("#w-out").innerHTML=`<div class="banner">Escribe un poco más antes de pedir corrección.</div>`;return}
    $("#w-go").disabled=true;$("#w-out").innerHTML=`<div class="card"><span class="muted">Claude está corrigiendo tu texto…</span></div>`;
    const res=await window.api.feedback(`You are an English teacher for a Spanish-speaking A2 student. ${PROFILE}
Writing task: ${w.mision}
Student text:
"""${ta.value}"""
Return JSON: {"corregido":"the full corrected text in English","errores":[{"mal":"...","bien":"...","porque":"short reason in Spanish"}],"bien":"one encouraging sentence in Spanish","puntaje":1-10}. 3 to 6 errors max.`);
    $("#w-go").disabled=false;
    if(!res.ok){$("#w-out").innerHTML=`<div class="banner">${esc(ERR[res.code]||ERR.error)}</div>`;return}
    const r=res.data;S.errors=mergeErr(r.errores||[],S.errors);S.lessons[id]={date:TODAY,score:(r.puntaje||"")+"/10"};addMin(10);addXP(60,"Misión de escritura");
    $("#w-out").innerHTML=`<div class="fbk"><h3 style="color:var(--green)">Puntaje: ${esc(r.puntaje)}/10</h3><p style="margin:0">${esc(r.bien)}</p><span class="label">Versión corregida</span><p style="margin:0;white-space:pre-wrap">${esc(r.corregido)}</p><button class="btn" data-say="${esc(r.corregido)}">🔊 Escuchar versión corregida</button>${errTable(r.errores||[])}</div>`}}
function errTable(es){return`<div style="overflow-x:auto"><table><thead><tr><th>❌ Escribiste</th><th>✅ Mejor así</th><th>Por qué</th></tr></thead><tbody>${es.map(e=>`<tr><td>${esc(e.mal)}</td><td><strong>${esc(e.bien)}</strong></td><td class="muted">${esc(e.porque)}</td></tr>`).join("")}</tbody></table></div>`}
function mergeErr(a,b){const seen=new Set();return[...a,...b].filter(e=>{if(!e||!e.mal)return false;const k=e.mal+"|"+e.bien;if(seen.has(k))return false;seen.add(k);return true}).slice(0,80)}

let FC=null;
VIEWS.cards=()=>{const due=shuffle(dueCards()).slice(0,20);FC={q:due,i:0,flip:false,done:0};renderCards()};
function renderCards(){
  if(!FC.q.length||FC.i>=FC.q.length){
    $("#main").innerHTML=`<div class="screen done-screen"><div class="big">🃏</div><h1>${FC.done?"¡Repaso terminado!":"Todo al día"}</h1><p class="muted">${FC.done?`Repasaste ${FC.done} tarjetas.`:"No tienes tarjetas pendientes. Vuelven cuando toque repasarlas."}</p><p class="muted">Frases aprendidas: <strong style="color:var(--ink)">${learned()}</strong> de ${allCards().length}</p><button class="btn primary big" data-nav="home">Volver al inicio</button></div>`;return}
  const c=FC.q[FC.i];
  $("#main").innerHTML=`<div class="screen">
    <div class="head"><div><h1>Tarjetas</h1><p>Di la frase en voz alta antes de voltearla.</p></div><span class="pill">${FC.i+1} / ${FC.q.length}</span></div>
    <div class="fc-wrap"><div class="fc ${FC.flip?"flip":""}" id="fc">
      <div class="side"><span class="label">Semana ${c.wk} · ¿Qué significa?</span><div class="phrase">${esc(c.en)}</div><button class="btn" data-say="${esc(c.en)}">🔊 Escuchar</button><span class="muted" style="font-size:13px">Clic o barra espaciadora para voltear</span></div>
      <div class="side back"><span class="label">Significado</span><div class="phrase" style="font-size:26px">${esc(c.en)}</div><div class="mean">${esc(c.es||"Inventa una frase tuya con esta expresión")}</div><button class="btn" data-say="${esc(c.en)}">🔊 Escuchar</button></div>
    </div></div>
    <div class="rate" ${FC.flip?"":"style='visibility:hidden'"}>
      <button class="r1" data-rate="1">Otra vez<small>1 min</small></button><button class="r2" data-rate="2">Difícil<small>${ivl(c,2)}</small></button><button class="r3" data-rate="3">Bien<small>${ivl(c,3)}</small></button><button class="r4" data-rate="4">Fácil<small>${ivl(c,4)}</small></button>
    </div></div>`;
  $("#fc").onclick=e=>{if(e.target.closest("[data-say]"))return;FC.flip=!FC.flip;renderCards();if(FC.flip)speak(c.en)};
  document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>rate(+b.dataset.rate));
  if(!FC.flip&&!FC.spoke){FC.spoke=true;setTimeout(()=>speak(c.en),250)}
}
function sched(c,g){const s=S.cards[c.id]||{ease:2.5,int:0,reps:0};let ease=s.ease,int=s.int,reps=s.reps;
  if(g===1){reps=0;int=0}else{ease=Math.max(1.3,ease+(g===2?-.15:g===4?.15:0));int=reps===0?(g===4?3:1):reps===1?(g===2?2:g===4?6:4):Math.round(int*ease*(g===2?.7:g===4?1.3:1));reps++}
  return{ease,int,reps,due:g===1?Date.now()+60e3:Date.now()+int*864e5,last:TODAY}}
function ivl(c,g){const d=sched(c,g).int;return d<1?"1 min":d===1?"1 día":d+" días"}
function rate(g){const c=FC.q[FC.i];S.cards[c.id]=sched(c,g);if(g===1)FC.q.push(c);FC.done++;addXP(2,"Tarjeta");FC.i++;FC.flip=false;FC.spoke=false;if(FC.done%10===0)addMin(5);renderCards()}
document.addEventListener("keydown",e=>{if(view!=="cards"||!FC||e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT")return;if(e.key===" "){e.preventDefault();FC.flip=!FC.flip;renderCards();if(FC.flip)speak(FC.q[FC.i].en)}if(FC.flip&&/^[1-4]$/.test(e.key))rate(+e.key)});

/* ---------- Talk ---------- */
const SCEN=[
  {id:"daily",e:"📅",t:"Tema del día",s:()=>topicToday,brief:()=>`Today's topic: "${topicToday}". This week's grammar: ${week(CUR).gram}. Ask questions one by one about the topic so the student practices that grammar.`},
  {id:"disney",e:"🏰",t:"Entrevista Disney",s:()=>"Recruiter del programa de intercambio",brief:()=>"Role-play: you are a friendly recruiter interviewing the student for the Disney International College / Cultural Exchange Program in the USA. Ask typical interview questions one at a time (tell me about yourself, why Disney, customer service experience, teamwork, a difficult situation, availability). Keep it realistic but kind."},
  {id:"free",e:"☕",t:"Charla libre",s:()=>"Hablamos de lo que quieras",brief:()=>"Free conversation about the student's life, interests and plans. Ask one question at a time."},
  {id:"restaurant",e:"🍔",t:"Restaurante",s:()=>"Pide comida en USA",brief:()=>"Role-play: you are a waiter at a diner in Orlando. The student is the customer. Be natural and ask the usual questions (table, drinks, order, how they want it, check)."},
  {id:"airport",e:"🛫",t:"Aeropuerto",s:()=>"Migración y check-in",brief:()=>"Role-play: you are a US immigration officer at Orlando airport, then an airline agent. Ask the usual questions (purpose of visit, how long, where staying, luggage)."},
  {id:"park",e:"🎢",t:"Trabajo en el parque",s:()=>"Atiende a un visitante",brief:()=>"Role-play: the student works at a theme park attraction or store; you are a tourist with questions and a small complaint. The student must help you politely."},
  {id:"correct",e:"✍️",t:"Corrige mi texto",s:()=>"Pega un texto tuyo",brief:()=>"The student will paste a short text they wrote. Reply in Spanish with: the corrected version in English (bold the changes), then the 3 most important errors explained briefly, then one encouraging line. Then ask in English for the next text."}
];
let talkMode="daily",hist=[],busy=false;
function sysPrompt(){const m=SCEN.find(x=>x.id===talkMode);return`You are Claude, a warm, patient English conversation partner for a Spanish-speaking student from Colombia. ${PROFILE}
Session: ${m.brief()}
Rules: speak simple, natural English at A2 level (short sentences, common words). Keep each reply to 1–3 short sentences and always end with ONE question, unless the session says otherwise. Do not correct every mistake during the chat; if the student writes a Spanish word or [brackets], give the English word in one short parenthesis, e.g. (piscina = pool). If the student writes "?", rephrase your last message more simply. Be encouraging. Plain text only.`}
VIEWS.talk=()=>{
  const m=SCEN.find(x=>x.id===talkMode),w=week(CUR);
  $("#main").innerHTML=`<div class="screen" style="max-width:1280px">
    <div class="head"><div><h1>Conversar</h1><p>Habla con Claude en inglés. Al final, pide tu corrección.</p></div><div style="display:flex;gap:8px"><button class="btn" id="t-new">↻ Nueva</button><button class="btn gold" id="t-end">Terminar y corregirme</button></div></div>
    <div class="banner" id="no-key" hidden>Para conversar, primero pega tu clave de API en <button class="btn" data-nav="settings" style="padding:2px 10px">Ajustes</button></div>
    <div class="talk">
      <div class="scen">${SCEN.map(s=>`<button class="sc" data-scen="${s.id}" aria-pressed="${s.id===talkMode}"><span class="e">${s.e}</span><span><b>${s.t}</b><small>${esc(s.s())}</small></span></button>`).join("")}</div>
      <div class="chatbox">
        <div class="chathead"><span class="avatar">🧑‍✈️</span><div><b>Claude · ${esc(m.t)}</b><small>● en línea · voz en inglés</small></div><label style="margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center"><input type="checkbox" id="autospeak" ${S.autospeak===false?"":"checked"}> Leer en voz alta</label></div>
        <div class="msgs" id="msgs"></div>
        <div class="composer"><button class="mic" title="Dictado de Windows: Windows + H" id="mic">🎙</button><textarea id="t-in" rows="1" placeholder="Escribe, o usa Windows + H para hablar"></textarea><button class="btn primary" id="t-send" style="height:48px">Enviar</button></div>
      </div>
      <div class="hints">
        <div class="card"><span class="label">Frases útiles · semana ${CUR}</span><div class="chips">${w.vocab.slice(0,10).map(v=>`<button class="chip" data-insert="${esc(v)}">${esc(v)}</button>`).join("")}</div></div>
        <div class="card"><span class="label">Salvavidas</span><div class="chips">${["Could you repeat that?","How do you say…?","What does … mean?","Let me think…","Sorry, I didn't catch that."].map(v=>`<button class="chip" data-insert="${esc(v)}">${esc(v)}</button>`).join("")}</div></div>
        <div class="card"><span class="label">Gramática de la semana</span><b>${md(w.gram)}</b></div>
      </div>
    </div><div id="t-fb"></div></div>`;
  $("#autospeak").onchange=e=>{S.autospeak=e.target.checked;save()};
  $("#t-send").onclick=send;$("#t-new").onclick=()=>{hist=[];renderMsgs();ask()};$("#t-end").onclick=endTalk;
  $("#mic").onclick=()=>{$("#t-in").focus();toast("Presiona Windows + H y habla en inglés")};
  const ti=$("#t-in");ti.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};ti.oninput=()=>{ti.style.height="auto";ti.style.height=Math.min(140,ti.scrollHeight)+"px"};
  renderMsgs();if(!hist.length)ask();
};
document.addEventListener("click",e=>{const s=e.target.closest("[data-scen]");if(s){talkMode=s.dataset.scen;hist=[];VIEWS.talk()}const ins=e.target.closest("[data-insert]");if(ins){const t=$("#t-in");t.value=(t.value?t.value+" ":"")+ins.dataset.insert;t.focus()}});
function renderMsgs(){const box=$("#msgs");if(!box)return;box.innerHTML=`<div class="msg note">${esc(SCEN.find(x=>x.id===talkMode).t)} · responde en inglés · escribe “?” si no entiendes</div>`+hist.map(m=>m.role==="assistant"?`<div class="msg bot">${esc(m.content)}<button class="say" data-say="${esc(m.content)}">🔊 Escuchar</button></div>`:`<div class="msg me">${esc(m.content)}</div>`).join("");box.scrollTop=box.scrollHeight}
const ERR={no_key:"Primero pega tu clave de API en Ajustes.",bad_key:"La clave de API no es válida. Revísala en Ajustes.",no_credit:"Tu cuenta de la API no tiene saldo. Agrega saldo en console.anthropic.com.",rate_limited:"Muchas solicitudes seguidas. Espera un minuto.",offline:"No hay conexión a internet.",refusal:"No puedo responder eso. Cambiemos de tema.",error:"No pude responder. Intenta de nuevo."};
async function ask(){
  const st=await window.api.getSettings();if(!st.hasKey){const b=$("#no-key");if(b)b.hidden=false;return}
  busy=true;const box=$("#msgs");const el=document.createElement("div");el.className="msg bot";el.textContent="…";box.appendChild(el);
  const r=await window.api.chat(sysPrompt(),[{role:"user",content:"Start the conversation now with a short greeting and your first question."},...hist],t=>{el.textContent=t||"…";box.scrollTop=box.scrollHeight});
  busy=false;
  if(r.ok){hist.push({role:"assistant",content:r.text});renderMsgs();if(S.autospeak!==false)speak(r.text)}else{el.textContent=ERR[r.code]||ERR.error}
}
async function send(){const t=$("#t-in").value.trim();if(!t||busy)return;$("#t-in").value="";if(!hist.length)hist.push({role:"assistant",content:"Hi! Let's talk."});hist.push({role:"user",content:t});renderMsgs();await ask()}
async function endTalk(){const said=hist.filter(m=>m.role==="user").map(m=>m.content);if(!said.length){toast("Conversa un poco primero");return}
  $("#t-fb").innerHTML=`<div class="card"><span class="muted">Claude está revisando tu conversación…</span></div>`;

Here is everything the student wrote in a conversation (scenario: ${SCEN.find(x=>x.id===talkMode).t}):
${said.map((x,i)=>(i+1)+". "+x).join("\n")}
Return JSON: {"bien":"one sentence in Spanish about what they did well","errores":[{"mal":"exact wrong phrase","bien":"corrected English","porque":"very short reason in Spanish"}],"frases":["3 useful natural English phrases for this topic"],"puntajes":{"fluidez":1-5,"gramatica":1-5,"vocabulario":1-5},"consejo":"one concrete tip in Spanish"}. 3 to 5 errors max.`);
  if(!res.ok){$("#t-fb").innerHTML=`<div class="banner">${esc(ERR[res.code]||ERR.error)}</div>`;return}
  const r=res.data,p=r.puntajes||{};S.errors=mergeErr(r.errores||[],S.errors);S.chats=(S.chats||0)+1;S.chatLog=S.chatLog||{};S.chatLog[TODAY]=1;S.scores=S.scores||[];S.scores.push({date:TODAY,...p});addMin(15);addXP(40,"Conversación");
  $("#t-fb").innerHTML=`<div class="fbk"><h3 style="color:var(--green)">¡Buen trabajo! Fluidez ${esc(p.fluidez)}/5 · Gramática ${esc(p.gramatica)}/5 · Vocabulario ${esc(p.vocabulario)}/5</h3><p style="margin:0">${esc(r.bien)}</p>${errTable(r.errores||[])}<span class="label">Frases para aprender</span><div class="chips">${(r.frases||[]).map(f=>`<button class="chip" data-say="${esc(f)}">🔊 ${esc(f)}</button>`).join("")}</div><p style="margin:0"><strong>Consejo:</strong> ${esc(r.consejo)}</p></div>`;
  $("#t-fb").scrollIntoView({behavior:"smooth"})}

    <div class="card"><h3>Hablar con tu voz</h3><p style="margin:0">En Conversar, haz clic en la caja de texto y presiona <strong>Windows + H</strong>. Para que entienda inglés, agrega <em>English (United States)</em> en Configuración → Hora e idioma → Idioma.</p></div>

  $("#s-name").oninput=e=>{S.name=e.target.value||"Santiago";save()};
