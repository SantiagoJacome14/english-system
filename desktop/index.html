<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:">
<title>English Boarding Pass</title>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/v3.css">
</head><body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo" aria-hidden="true">✈</span><div><b>English<br>Boarding Pass</b><small>BGA → USA</small></div></div>
    <nav id="nav">
      <span class="navg">Aprender</span>
      <button data-go="home"><span class="i">🏠</span>Inicio</button>
      <button data-go="path"><span class="i">🗺️</span>Ruta</button>
      <button data-go="story"><span class="i">✈️</span>Viaje a Orlando</button>
      <button data-go="cards"><span class="i">🃏</span>Tarjetas<span class="badge" id="due-badge" hidden>0</span></button>
      <button data-go="listen"><span class="i">🎧</span>Dictado</button>
      <span class="navg">Hablar</span>
      <button data-go="call"><span class="i">📞</span>Llamada</button>
      <button data-go="talk"><span class="i">💬</span>Chat</button>
      <button data-go="pron"><span class="i">🎯</span>Pronunciación</button>
      <button data-go="interview"><span class="i">🏰</span>Entrevista Disney</button>
      <span class="navg">Jugar y medir</span>
      <button data-go="games"><span class="i">🎮</span>Juegos</button>
      <button data-go="progress"><span class="i">📈</span>Progreso y logros</button>
      <button data-go="settings"><span class="i">⚙️</span>Ajustes</button>
    </nav>
    <div class="rank">
      <div class="row"><span class="label">Rango</span><span class="pill gold" id="r-xp">0 XP</span></div>
      <b id="r-name">Pasajero</b>
      <div class="bar"><i id="r-bar" style="width:0%"></i></div>
      <small class="muted" id="r-next"></small>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="src/data.js"></script>
<script src="src/voice.js"></script>
<script src="src/fun.js"></script>
<script src="src/app.js"></script>
<script src="src/call.js"></script>
<script src="src/speak.js"></script>
<script src="src/play.js"></script>
<script src="src/boot.js"></script>
</body></html>
